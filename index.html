<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人债务管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9fafb;
        }
        .hidden {
            display: none;
        }
        .show {
            display: table-row;
        }
        .save-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #10b981;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            z-index: 1000;
            animation: pulse 2s ease-in-out;
        }
        @keyframes pulse {
            0% { opacity: 0; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.9); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Save Notification -->
        <div id="saveNotification" class="save-notification hidden">
            <i class="fas fa-check-circle mr-2"></i>
            已保存
        </div>

        <!-- Header -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center mb-4">
                <i class="fas fa-chart-line text-blue-600 mr-3 text-2xl"></i>
                <h1 class="text-3xl font-semibold text-gray-900">个人债务管理</h1>
            </div>
            <p class="text-gray-500 text-sm">清晰掌握每个平台的负债情况</p>
        </div>

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200">
                <h3 class="text-sm font-medium text-gray-500 mb-2">总负债</h3>
                <p id="totalDebt" class="text-2xl font-semibold text-gray-900">¥0.00</p>
            </div>
            
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200">
                <h3 class="text-sm font-medium text-gray-500 mb-2">剩余利息</h3>
                <p id="totalInterest" class="text-2xl font-semibold text-gray-900">¥0.00</p>
            </div>
            
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200">
                <h3 class="text-sm font-medium text-gray-500 mb-2">月还款总额</h3>
                <p id="monthlyPayment" class="text-2xl font-semibold text-gray-900">¥0.00</p>
            </div>
        </div>

        <!-- Monthly Repayment Schedule Summary -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200 mb-8">
            <div class="flex items-center mb-4">
                <i class="fas fa-calendar-alt text-blue-600 mr-2"></i>
                <h3 class="text-lg font-semibold text-gray-900">每月还款日汇总</h3>
            </div>
            <div id="monthlySummary">
                <p class="text-gray-500 text-sm">暂无还款计划</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="mb-6 flex flex-wrap gap-3">
            <button id="addPlatformBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition-colors duration-200">
                <i class="fas fa-plus mr-1.5"></i>
                添加平台
            </button>
            <button id="addLoanBtn" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition-colors duration-200">
                <i class="fas fa-file-alt mr-1.5"></i>
                添加借据
            </button>
        </div>

        <!-- Platforms List -->
        <div id="platformsContainer" class="space-y-4">
            <div class="text-center py-12">
                <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-folder text-gray-400 text-2xl"></i>
                </div>
                <h3 class="text-lg font-medium text-gray-900 mb-2">暂无贷款平台</h3>
                <p class="text-gray-500 text-sm">点击"添加平台"开始管理您的债务</p>
            </div>
        </div>
    </div>

    <!-- Platform Form Modal -->
    <div id="platformModal" class="fixed inset-0 bg-black bg-opacity-20 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md">
            <div class="p-6">
                <h2 id="platformModalTitle" class="text-xl font-semibold text-gray-900 mb-5">添加新平台</h2>
                
                <form id="platformForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">平台名称</label>
                        <input type="text" id="platformName" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">还款日</label>
                        <input type="number" id="repaymentDay" min="1" max="31" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                    </div>
                    
                    <div class="flex justify-end space-x-3 pt-4">
                        <button type="button" id="cancelPlatformBtn" class="px-4 py-2.5 text-gray-600 hover:text-gray-800 font-medium text-sm">
                            取消
                        </button>
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition-colors">
                            添加
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Loan Form Modal -->
    <div id="loanModal" class="fixed inset-0 bg-black bg-opacity-20 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <h2 id="loanModalTitle" class="text-xl font-semibold text-gray-900 mb-5">添加新借据</h2>
                
                <form id="loanForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">所属平台</label>
                        <select id="loanPlatformId" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                            <option value="">选择平台</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">借据描述</label>
                        <input type="text" id="loanDescription" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="例如：消费贷-2024年1月" required>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">贷款总额</label>
                            <input type="number" id="loanTotalAmount" step="0.01" min="0.01" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">贷款期限 (月)</label>
                            <input type="number" id="loanTotalMonths" min="1" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">已还月数</label>
                            <input type="number" id="loanRepaidMonths" min="0" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">宽限期 (月)</label>
                            <input type="number" id="loanGracePeriod" min="0" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="0">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">还款方式</label>
                        <select id="loanRepaymentType" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="equal_principal_interest">等额本息</option>
                            <option value="equal_principal">等额本金</option>
                        </select>
                    </div>
                    
                    <div class="border-t border-gray-200 pt-4">
                        <label class="block text-sm font-medium text-gray-700 mb-3">输入方式</label>
                        <div class="flex space-x-6">
                            <label class="flex items-center cursor-pointer">
                                <input type="radio" name="loanInputMode" value="rate" class="mr-2 w-4 h-4 text-blue-600" checked>
                                <span class="text-sm">年化利率 (%)</span>
                            </label>
                            <label class="flex items-center cursor-pointer">
                                <input type="radio" name="loanInputMode" value="interest" class="mr-2 w-4 h-4 text-blue-600">
                                <span class="text-sm">剩余总利息 (¥)</span>
                            </label>
                        </div>
                    </div>
                    
                    <div id="rateInput" class="block">
                        <label class="block text-sm font-medium text-gray-700 mb-2">年化利率 (%)</label>
                        <input type="number" id="loanAnnualRate" step="0.01" min="0" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                    </div>
                    
                    <div id="interestInput" class="hidden">
                        <label class="block text-sm font-medium text-gray-700 mb-2">剩余总利息 (¥)</label>
                        <input type="number" id="loanTotalInterest" step="0.01" min="0" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                    </div>
                    
                    <div class="flex justify-end space-x-3 pt-2">
                        <button type="button" id="cancelLoanBtn" class="px-4 py-2.5 text-gray-600 hover:text-gray-800 font-medium text-sm">
                            取消
                        </button>
                        <button type="submit" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition-colors">
                            添加
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // 数据存储
        let platforms = [];
        let editingPlatform = null;
        let editingLoan = null;
        let selectedPlatformId = null;
        let expandedLoans = new Set();

        // DOM 元素
        const saveNotification = document.getElementById('saveNotification');
        const platformsContainer = document.getElementById('platformsContainer');
        const platformModal = document.getElementById('platformModal');
        const loanModal = document.getElementById('loanModal');
        const addPlatformBtn = document.getElementById('addPlatformBtn');
        const addLoanBtn = document.getElementById('addLoanBtn');
        const cancelPlatformBtn = document.getElementById('cancelPlatformBtn');
        const cancelLoanBtn = document.getElementById('cancelLoanBtn');
        const platformForm = document.getElementById('platformForm');
        const loanForm = document.getElementById('loanForm');
        const loanInputModeRadios = document.querySelectorAll('input[name="loanInputMode"]');
        const rateInput = document.getElementById('rateInput');
        const interestInput = document.getElementById('interestInput');
        const loanPlatformId = document.getElementById('loanPlatformId');

        // 工具函数
        function showSaveNotification() {
            saveNotification.classList.remove('hidden');
            setTimeout(() => {
                saveNotification.classList.add('hidden');
            }, 2000);
        }

        function formatCurrency(amount) {
            return '¥' + parseFloat(amount).toLocaleString('zh-CN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // 计算函数
        function calculateEqualPrincipalInterestSchedule(totalAmount, annualRate, totalMonths, repaidMonths, gracePeriod = 0) {
            if (!totalAmount || !annualRate || !totalMonths || totalAmount <= 0 || annualRate <= 0) return [];
            
            const monthlyRate = annualRate / 100 / 12;
            const actualPrincipalMonths = Math.max(1, totalMonths - gracePeriod);
            const monthlyPayment = (totalAmount * monthlyRate * Math.pow(1 + monthlyRate, actualPrincipalMonths)) / 
                                  (Math.pow(1 + monthlyRate, actualPrincipalMonths) - 1);
            
            let remainingBalance = totalAmount;
            let schedule = [];
            
            for (let month = 1; month <= totalMonths; month++) {
                if (month <= gracePeriod) {
                    const interestPayment = remainingBalance * monthlyRate;
                    schedule.push({
                        month: month,
                        principal: 0,
                        interest: interestPayment,
                        total: interestPayment,
                        balance: remainingBalance
                    });
                } else {
                    const interestPayment = remainingBalance * monthlyRate;
                    const principalPayment = monthlyPayment - interestPayment;
                    const endingBalance = Math.max(0, remainingBalance - principalPayment);
                    
                    schedule.push({
                        month: month,
                        principal: principalPayment,
                        interest: interestPayment,
                        total: monthlyPayment,
                        balance: endingBalance
                    });
                    
                    remainingBalance = endingBalance;
                    if (remainingBalance <= 0.01) {
                        for (let m = month + 1; m <= totalMonths; m++) {
                            schedule.push({
                                month: m,
                                principal: 0,
                                interest: 0,
                                total: 0,
                                balance: 0
                            });
                        }
                        break;
                    }
                }
            }
            
            return schedule;
        }

        function calculateEqualPrincipalSchedule(totalAmount, annualRate, totalMonths, repaidMonths, gracePeriod = 0) {
            if (!totalAmount || !annualRate || !totalMonths || totalAmount <= 0 || annualRate <= 0) return [];
            
            const actualPrincipalMonths = Math.max(1, totalMonths - gracePeriod);
            const monthlyPrincipal = totalAmount / actualPrincipalMonths;
            const monthlyRate = annualRate / 100 / 12;
            let remainingBalance = totalAmount;
            let schedule = [];
            
            for (let month = 1; month <= totalMonths; month++) {
                if (month <= gracePeriod) {
                    const interestPayment = remainingBalance * monthlyRate;
                    schedule.push({
                        month: month,
                        principal: 0,
                        interest: interestPayment,
                        total: interestPayment,
                        balance: remainingBalance
                    });
                } else {
                    const interestPayment = remainingBalance * monthlyRate;
                    const totalPayment = monthlyPrincipal + interestPayment;
                    const endingBalance = Math.max(0, remainingBalance - monthlyPrincipal);
                    
                    schedule.push({
                        month: month,
                        principal: monthlyPrincipal,
                        interest: interestPayment,
                        total: totalPayment,
                        balance: endingBalance
                    });
                    
                    remainingBalance = endingBalance;
                    if (remainingBalance <= 0.01) {
                        for (let m = month + 1; m <= totalMonths; m++) {
                            schedule.push({
                                month: m,
                                principal: 0,
                                interest: 0,
                                total: 0,
                                balance: 0
                            });
                        }
                        break;
                    }
                }
            }
            
            return schedule;
        }

        function calculateEqualPrincipalInterest(totalAmount, annualRate, totalMonths, repaidMonths, gracePeriod = 0) {
            if (!totalAmount || !annualRate || !totalMonths) return null;
            
            const monthlyRate = annualRate / 100 / 12;
            const remainingMonths = totalMonths - repaidMonths;
            const graceMonthsRemaining = Math.max(0, gracePeriod - repaidMonths);
            
            if (remainingMonths <= 0) {
                return { remainingPrincipal: 0, remainingInterest: 0, monthlyPayment: 0, remainingMonths: 0, graceMonthsRemaining: 0 };
            }
            
            const actualPrincipalMonths = Math.max(1, totalMonths - gracePeriod);
            const monthlyPayment = (totalAmount * monthlyRate * Math.pow(1 + monthlyRate, actualPrincipalMonths)) / 
                                  (Math.pow(1 + monthlyRate, actualPrincipalMonths) - 1);
            
            let remainingBalance = totalAmount;
            
            for (let month = 1; month <= repaidMonths; month++) {
                if (month <= gracePeriod) {
                } else {
                    const interestPayment = remainingBalance * monthlyRate;
                    const principalPayment = monthlyPayment - interestPayment;
                    remainingBalance = Math.max(0, remainingBalance - principalPayment);
                }
            }
            
            let remainingInterest = 0;
            let tempBalance = remainingBalance;
            
            for (let month = repaidMonths + 1; month <= totalMonths; month++) {
                if (month <= gracePeriod) {
                    remainingInterest += tempBalance * monthlyRate;
                } else {
                    const interestPayment = tempBalance * monthlyRate;
                    remainingInterest += interestPayment;
                    const principalPayment = monthlyPayment - interestPayment;
                    tempBalance = Math.max(0, tempBalance - principalPayment);
                }
            }
            
            let currentMonthlyPayment = 0;
            if (repaidMonths + 1 <= gracePeriod) {
                currentMonthlyPayment = remainingBalance * monthlyRate;
            } else {
                currentMonthlyPayment = monthlyPayment;
            }
            
            return {
                remainingPrincipal: Math.max(0, remainingBalance),
                remainingInterest: Math.max(0, remainingInterest),
                monthlyPayment: currentMonthlyPayment,
                remainingMonths: remainingMonths,
                graceMonthsRemaining: graceMonthsRemaining
            };
        }

        function calculateEqualPrincipal(totalAmount, annualRate, totalMonths, repaidMonths, gracePeriod = 0) {
            if (!totalAmount || !annualRate || !totalMonths) return null;
            
            const actualPrincipalMonths = Math.max(1, totalMonths - gracePeriod);
            const monthlyPrincipal = totalAmount / actualPrincipalMonths;
            const monthlyRate = annualRate / 100 / 12;
            const remainingMonths = totalMonths - repaidMonths;
            const graceMonthsRemaining = Math.max(0, gracePeriod - repaidMonths);
            
            if (remainingMonths <= 0) {
                return { remainingPrincipal: 0, remainingInterest: 0, currentMonthlyPayment: 0, remainingMonths: 0, graceMonthsRemaining: 0 };
            }
            
            let remainingBalance = totalAmount;
            
            for (let month = 1; month <= repaidMonths; month++) {
                if (month <= gracePeriod) {
                } else {
                    remainingBalance = Math.max(0, remainingBalance - monthlyPrincipal);
                }
            }
            
            let remainingInterest = 0;
            let tempBalance = remainingBalance;
            
            for (let month = repaidMonths + 1; month <= totalMonths; month++) {
                remainingInterest += tempBalance * monthlyRate;
                if (month > gracePeriod) {
                    tempBalance = Math.max(0, tempBalance - monthlyPrincipal);
                }
            }
            
            let currentMonthlyPayment = 0;
            if (repaidMonths + 1 <= gracePeriod) {
                currentMonthlyPayment = remainingBalance * monthlyRate;
            } else {
                currentMonthlyPayment = monthlyPrincipal + (remainingBalance * monthlyRate);
            }
            
            return {
                remainingPrincipal: Math.max(0, remainingBalance),
                remainingInterest: Math.max(0, remainingInterest),
                currentMonthlyPayment: currentMonthlyPayment,
                remainingMonths: remainingMonths,
                graceMonthsRemaining: graceMonthsRemaining
            };
        }

        // 计算汇总
        function getPlatformSummary(platform) {
            const totalPrincipal = platform.loans.reduce((sum, loan) => {
                if (loan.inputMode === 'interest') {
                    return sum + loan.totalAmount;
                } else {
                    const calculation = loan.repaymentType === 'equal_principal_interest' 
                        ? calculateEqualPrincipalInterest(loan.totalAmount, loan.annualRate, loan.totalMonths, loan.repaidMonths, loan.gracePeriod)
                        : calculateEqualPrincipal(loan.totalAmount, loan.annualRate, loan.totalMonths, loan.repaidMonths, loan.gracePeriod);
                    return sum + (calculation?.remainingPrincipal || 0);
                }
            }, 0);

            const totalInterest = platform.loans.reduce((sum, loan) => {
                if (loan.inputMode === 'interest') {
                    return sum + loan.totalInterest;
                } else {
                    const calculation = loan.repaymentType === 'equal_principal_interest' 
                        ? calculateEqualPrincipalInterest(loan.totalAmount, loan.annualRate, loan.totalMonths, loan.repaidMonths, loan.gracePeriod)
                        : calculateEqualPrincipal(loan.totalAmount, loan.annualRate, loan.totalMonths, loan.repaidMonths, loan.gracePeriod);
                    return sum + (calculation?.remainingInterest || 0);
                }
            }, 0);

            const totalMonthlyPayment = platform.loans.reduce((sum, loan) => {
                if (loan.inputMode === 'interest') {
                    const remainingMonths = loan.totalMonths - loan.repaidMonths;
                    return sum + (remainingMonths > 0 ? (loan.totalAmount + loan.totalInterest) / remainingMonths : 0);
                } else {
                    const calculation = loan.repaymentType === 'equal_principal_interest' 
                        ? calculateEqualPrincipalInterest(loan.totalAmount, loan.annualRate, loan.totalMonths, loan.repaidMonths, loan.gracePeriod)
                        : calculateEqualPrincipal(loan.totalAmount, loan.annualRate, loan.totalMonths, loan.repaidMonths, loan.gracePeriod);
                    return sum + (calculation?.monthlyPayment || calculation?.currentMonthlyPayment || 0);
                }
            }, 0);

            const maxRemainingMonths = Math.max(...platform.loans.map(loan => {
                if (loan.inputMode === 'interest') {
                    return loan.totalMonths - loan.repaidMonths;
                } else {
                    const calculation = loan.repaymentType === 'equal_principal_interest' 
                        ? calculateEqualPrincipalInterest(loan.totalAmount, loan.annualRate, loan.totalMonths, loan.repaidMonths, loan.gracePeriod)
                        : calculateEqualPrincipal(loan.totalAmount, loan.annualRate, loan.totalMonths, loan.repaidMonths, loan.gracePeriod);
                    return calculation?.remainingMonths || 0;
                }
            }), 0);

            return { totalPrincipal, totalInterest, totalMonthlyPayment, maxRemainingMonths };
        }

        function getTotalDebt() {
            return platforms.reduce((sum, platform) => {
                const summary = getPlatformSummary(platform);
                return sum + summary.totalPrincipal;
            }, 0);
        }

        function getTotalRemainingInterest() {
            return platforms.reduce((sum, platform) => {
                const summary = getPlatformSummary(platform);
                return sum + summary.totalInterest;
            }, 0);
        }

        function getTotalMonthlyPayment() {
            return platforms.reduce((sum, platform) => {
                const summary = getPlatformSummary(platform);
                return sum + summary.totalMonthlyPayment;
            }, 0);
        }

        function getMonthlyRepaymentSummary() {
            const repaymentMap = new Map();
            
            platforms.forEach(platform => {
                const repaymentDay = platform.repaymentDay;
                const summary = getPlatformSummary(platform);
                
                if (summary.totalMonthlyPayment > 0) {
                    if (!repaymentMap.has(repaymentDay)) {
                        repaymentMap.set(repaymentDay, []);
                    }
                    repaymentMap.get(repaymentDay).push({
                        platformName: platform.name,
                        amount: summary.totalMonthlyPayment
                    });
                }
            });
            
            return Array.from(repaymentMap.entries())
                .sort((a, b) => a[0] - b[0])
                .map(([day, platforms]) => ({
                    day,
                    platforms,
                    total: platforms.reduce((sum, p) => sum + p.amount, 0)
                }));
        }

        // UI 更新函数
        function updateSummary() {
            document.getElementById('totalDebt').textContent = formatCurrency(getTotalDebt());
            document.getElementById('totalInterest').textContent = formatCurrency(getTotalRemainingInterest());
            document.getElementById('monthlyPayment').textContent = formatCurrency(getTotalMonthlyPayment());
        }

        function updateMonthlySummary() {
            const monthlySummary = document.getElementById('monthlySummary');
            const summaryData = getMonthlyRepaymentSummary();
            
            if (summaryData.length > 0) {
                let html = '';
                summaryData.forEach(item => {
                    html += `
                        <div class="border-b border-gray-100 pb-4 last:border-b-0 last:pb-0">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-sm font-medium text-gray-900">每月 ${item.day} 号</span>
                                <span class="text-lg font-semibold text-blue-600">${formatCurrency(item.total)}</span>
                            </div>
                            <div class="space-y-1">
                    `;
                    item.platforms.forEach(platform => {
                        html += `
                            <div class="flex justify-between text-sm text-gray-600">
                                <span>${platform.platformName}</span>
                                <span>${formatCurrency(platform.amount)}</span>
                            </div>
                        `;
                    });
                    html += `
                            </div>
                        </div>
                    `;
                });
                monthlySummary.innerHTML = html;
            } else {
                monthlySummary.innerHTML = '<p class="text-gray-500 text-sm">暂无还款计划</p>';
            }
        }

        function updatePlatformSelect() {
            loanPlatformId.innerHTML = '<option value="">选择平台</option>';
            platforms.forEach(platform => {
                const option = document.createElement('option');
                option.value = platform.id;
                option.textContent = platform.name;
                loanPlatformId.appendChild(option);
            });
        }

        function renderPlatforms() {
            if (platforms.length === 0) {
                platformsContainer.innerHTML = `
                    <div class="text-center py-12">
                        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-folder text-gray-400 text-2xl"></i>
                        </div>
                        <h3 class="text-lg font-medium text-gray-900 mb-2">暂无贷款平台</h3>
                        <p class="text-gray-500 text-sm">点击"添加平台"开始管理您的债务</p>
                    </div>
                `;
                return;
            }

            let html = '';
            platforms.forEach(platform => {
                const summary = getPlatformSummary(platform);
                const isExpanded = selectedPlatformId === platform.id;
                
                html += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden" data-platform-id="${platform.id}">
                        <div class="p-5 cursor-pointer hover:bg-gray-50 transition-colors platform-header">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center min-w-0">
                                    <i class="fas fa-chevron-${isExpanded ? 'down' : 'right'} text-${isExpanded ? 'blue-600' : 'gray-400'} mr-3 flex-shrink-0"></i>
                                    <i class="fas fa-folder text-blue-600 mr-3 flex-shrink-0"></i>
                                    <div class="min-w-0">
                                        <h3 class="text-lg font-semibold text-gray-900 truncate">${platform.name}</h3>
                                        <p class="text-sm text-gray-500">每月 ${platform.repaymentDay} 号还款</p>
                                    </div>
                                </div>
                                <div class="text-right flex-shrink-0">
                                    <div class="text-lg font-semibold text-gray-900">${formatCurrency(summary.totalPrincipal)}</div>
                                    <div class="text-sm text-gray-500">${platform.loans.length} 笔 • 月还 ${formatCurrency(summary.totalMonthlyPayment)}</div>
                                </div>
                            </div>
                        </div>
                `;
                
                if (isExpanded) {
                    html += `
                        <div class="bg-gray-50 px-5 py-4 border-t border-gray-200">
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                                <div>
                                    <span class="text-gray-500">剩余本金</span>
                                    <div class="font-semibold text-gray-900 mt-1">${formatCurrency(summary.totalPrincipal)}</div>
                                </div>
                                <div>
                                    <span class="text-gray-500">剩余利息</span>
                                    <div class="font-semibold text-gray-900 mt-1">${formatCurrency(summary.totalInterest)}</div>
                                </div>
                                <div>
                                    <span class="text-gray-500">月还款额</span>
                                    <div class="font-semibold text-gray-900 mt-1">${formatCurrency(summary.totalMonthlyPayment)}</div>
                                </div>
                                <div>
                                    <span class="text-gray-500">剩余期数</span>
                                    <div class="font-semibold text-gray-900 mt-1">${summary.maxRemainingMonths} 个月</div>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    // Loans table
                    if (platform.loans.length > 0) {
                        html += '<div class="border-t border-gray-200"><div class="overflow-x-auto"><table class="w-full"><thead class="bg-gray-50"><tr><th class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">借据</th><th class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">剩余本金</th><th class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">月还款</th><th class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">剩余月数</th><th class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th></tr></thead><tbody class="divide-y divide-gray-200">';
                        
                        platform.loans.forEach(loan => {
                            let remainingPrincipal, monthlyPayment, remainingMonths, graceMonthsRemaining;
                            
                            if (loan.inputMode === 'interest') {
                                remainingPrincipal = loan.totalAmount;
                                remainingMonths = loan.totalMonths - loan.repaidMonths;
                                monthlyPayment = remainingMonths > 0 ? (loan.totalAmount + loan.totalInterest) / remainingMonths : 0;
                                graceMonthsRemaining = Math.max(0, loan.gracePeriod - loan.repaidMonths);
                            } else {
                                const calculation = loan.repaymentType === 'equal_principal_interest'
                                    ? calculateEqualPrincipalInterest(loan.totalAmount, loan.annualRate, loan.totalMonths, loan.repaidMonths, loan.gracePeriod)
                                    : calculateEqualPrincipal(loan.totalAmount, loan.annualRate, loan.totalMonths, loan.repaidMonths, loan.gracePeriod);
                                
                                remainingPrincipal = calculation?.remainingPrincipal || 0;
                                monthlyPayment = calculation?.monthlyPayment || calculation?.currentMonthlyPayment || 0;
                                remainingMonths = calculation?.remainingMonths || 0;
                                graceMonthsRemaining = calculation?.graceMonthsRemaining || 0;
                            }
                            
                            const isLoanExpanded = expandedLoans.has(loan.id);
                            
                            html += `
                                <tr class="hover:bg-gray-50 cursor-pointer loan-row" data-loan-id="${loan.id}">
                                    <td class="px-5 py-4">
                                        <div class="flex items-center">
                                            <i class="fas fa-chevron-${isLoanExpanded ? 'down' : 'right'} text-gray-400 mr-2 flex-shrink-0"></i>
                                            <div class="min-w-0">
                                                <div class="text-sm font-medium text-gray-900 truncate">${loan.description}</div>
                                                <div class="text-xs text-gray-500">
                                                    ${loan.repaymentType === 'equal_principal_interest' ? '等额本息' : '等额本金'}
                                                    ${loan.gracePeriod > 0 ? ` · 宽限期${loan.gracePeriod}月` : ''}
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="px-5 py-4 whitespace-nowrap">
                                        <div class="text-sm text-gray-900">${formatCurrency(remainingPrincipal)}</div>
                                    </td>
                                    <td class="px-5 py-4 whitespace-nowrap">
                                        <div class="text-sm text-gray-900">${formatCurrency(monthlyPayment)}</div>
                                        ${graceMonthsRemaining > 0 ? `<div class="text-xs text-gray-500">(${graceMonthsRemaining}月宽限)</div>` : ''}
                                    </td>
                                    <td class="px-5 py-4 whitespace-nowrap">
                                        <div class="text-sm text-gray-900">${remainingMonths} 个月</div>
                                    </td>
                                    <td class="px-5 py-4 whitespace-nowrap">
                                        <div class="flex space-x-2">
                                            <button class="edit-loan-btn text-gray-600 hover:text-gray-900 p-1" data-platform-id="${platform.id}" data-loan-id="${loan.id}">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <button class="delete-loan-btn text-red-600 hover:text-red-800 p-1 flex items-center text-sm" data-platform-id="${platform.id}" data-loan-id="${loan.id}">
                                                <i class="fas fa-trash mr-1"></i>结清
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            `;
                            
                            if (isLoanExpanded) {
                                let schedule = [];
                                if (loan.inputMode === 'interest') {
                                    schedule = generateScheduleFromTotalInterest(
                                        loan.totalAmount,
                                        loan.totalInterest,
                                        loan.totalMonths,
                                        loan.repaidMonths,
                                        loan.gracePeriod
                                    );
                                } else {
                                    schedule = loan.repaymentType === 'equal_principal_interest'
                                        ? calculateEqualPrincipalInterestSchedule(
                                            loan.totalAmount,
                                            loan.annualRate,
                                            loan.totalMonths,
                                            loan.repaidMonths,
                                            loan.gracePeriod
                                        )
                                        : calculateEqualPrincipalSchedule(
                                            loan.totalAmount,
                                            loan.annualRate,
                                            loan.totalMonths,
                                            loan.repaidMonths,
                                            loan.gracePeriod
                                        );
                                }
                                
                                if (schedule.length === 0 && loan.totalAmount > 0) {
                                    schedule = [];
                                    for (let i = 1; i <= Math.min(loan.totalMonths, 8); i++) {
                                        schedule.push({
                                            month: i,
                                            principal: 0,
                                            interest: 0,
                                            total: 0,
                                            balance: loan.totalAmount
                                        });
                                    }
                                }
                                
                                html += `<tr class="loan-detail-row"><td colspan="5" class="px-5 py-4 bg-gray-50"><div class="overflow-x-auto"><div class="flex items-center justify-between mb-3"><h4 class="text-sm font-medium text-gray-900">月度还款明细</h4>${loan.gracePeriod > 0 ? `<span class="text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded">前${loan.gracePeriod}月宽限期</span>` : ''}</div><div class="overflow-x-auto"><table class="w-full text-xs"><thead><tr class="bg-white border-b border-gray-200"><th class="px-3 py-2 text-left text-gray-500">期数</th><th class="px-3 py-2 text-left text-gray-500">本金</th><th class="px-3 py-2 text-left text-gray-500">利息</th><th class="px-3 py-2 text-left text-gray-500">月供</th><th class="px-3 py-2 text-left text-gray-500">剩余本金</th></tr></thead><tbody>`;
                                
                                schedule.slice(0, 8).forEach((item, index) => {
                                    html += `
                                        <tr class="border-b border-gray-100 hover:bg-gray-100">
                                            <td class="px-3 py-2 text-gray-900">
                                                ${item.month}
                                                ${item.month <= loan.gracePeriod ? '<span class="text-blue-600 ml-1">(宽限)</span>' : ''}
                                            </td>
                                            <td class="px-3 py-2 text-green-600">${formatCurrency(item.principal)}</td>
                                            <td class="px-3 py-2 text-orange-600">${formatCurrency(item.interest)}</td>
                                            <td class="px-3 py-2 text-blue-600 font-medium">${formatCurrency(item.total)}</td>
                                            <td class="px-3 py-2 text-gray-600">${formatCurrency(Math.max(0, item.balance))}</td>
                                        </tr>
                                    `;
                                });
                                
                                html += `</tbody></table></div>${schedule.length > 8 ? `<p class="text-xs text-gray-500 mt-2">显示前8期，共${schedule.length}期</p>` : ''}</div></td></tr>`;
                            }
                        });
                        
                        html += '</tbody></table></div>';
                        
                        // Platform actions
                        html += `
                            <div class="p-4 bg-gray-50 flex justify-end space-x-3">
                                <button class="add-loan-to-platform-btn text-blue-600 hover:text-blue-800 font-medium text-sm flex items-center" data-platform-id="${platform.id}">
                                    <i class="fas fa-plus mr-1"></i>添加借据
                                </button>
                                <button class="edit-platform-btn text-gray-600 hover:text-gray-800 font-medium text-sm" data-platform-id="${platform.id}">
                                    编辑
                                </button>
                                <button class="delete-platform-btn text-red-600 hover:text-red-800 font-medium text-sm flex items-center" data-platform-id="${platform.id}">
                                    <i class="fas fa-trash mr-1"></i>结清(删除)
                                </button>
                            </div>
                        `;
                    }
                    
                    html += '</div>';
                }
                
                html += '</div>';
            });
            
            platformsContainer.innerHTML = html;
            
            // Add event listeners
            document.querySelectorAll('.platform-header').forEach(header => {
                header.addEventListener('click', (e) => {
                    const platformId = parseInt(e.currentTarget.closest('[data-platform-id]').dataset.platformId);
                    selectedPlatformId = selectedPlatformId === platformId ? null : platformId;
                    renderPlatforms();
                    updateSummary();
                    updateMonthlySummary();
                });
            });
            
            document.querySelectorAll('.loan-row').forEach(row => {
                row.addEventListener('click', (e) => {
                    if (e.target.closest('.edit-loan-btn') || e.target.closest('.delete-loan-btn')) {
                        return;
                    }
                    const loanId = parseInt(e.currentTarget.dataset.loanId);
                    if (expandedLoans.has(loanId)) {
                        expandedLoans.delete(loanId);
                    } else {
                        expandedLoans.add(loanId);
                    }
                    renderPlatforms();
                });
            });
            
            document.querySelectorAll('.edit-platform-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const platformId = parseInt(e.currentTarget.dataset.platformId);
                    const platform = platforms.find(p => p.id === platformId);
                    editingPlatform = platformId;
                    document.getElementById('platformModalTitle').textContent = '编辑平台';
                    document.getElementById('platformName').value = platform.name;
                    document.getElementById('repaymentDay').value = platform.repaymentDay;
                    platformModal.classList.remove('hidden');
                });
            });
            
            document.querySelectorAll('.delete-platform-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const platformId = parseInt(e.currentTarget.dataset.platformId);
                    platforms = platforms.filter(p => p.id !== platformId);
                    if (selectedPlatformId === platformId) {
                        selectedPlatformId = null;
                    }
                    renderPlatforms();
                    updateSummary();
                    updateMonthlySummary();
                    updatePlatformSelect();
                    showSaveNotification();
                });
            });
            
            document.querySelectorAll('.add-loan-to-platform-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const platformId = parseInt(e.currentTarget.dataset.platformId);
                    document.getElementById('loanPlatformId').value = platformId;
                    loanModal.classList.remove('hidden');
                });
            });
            
            document.querySelectorAll('.edit-loan-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const platformId = parseInt(e.currentTarget.dataset.platformId);
                    const loanId = parseInt(e.currentTarget.dataset.loanId);
                    const platform = platforms.find(p => p.id === platformId);
                    const loan = platform.loans.find(l => l.id === loanId);
                    editingLoan = { platformId, loanId };
                    document.getElementById('loanModalTitle').textContent = '编辑借据';
                    document.getElementById('loanPlatformId').value = platformId;
                    document.getElementById('loanDescription').value = loan.description;
                    document.getElementById('loanTotalAmount').value = loan.totalAmount;
                    document.getElementById('loanTotalMonths').value = loan.totalMonths;
                    document.getElementById('loanRepaidMonths').value = loan.repaidMonths || 0;
                    document.getElementById('loanGracePeriod').value = loan.gracePeriod || 0;
                    document.getElementById('loanRepaymentType').value = loan.repaymentType;
                    
                    if (loan.inputMode === 'rate') {
                        document.querySelector('input[name="loanInputMode"][value="rate"]').checked = true;
                        rateInput.classList.remove('hidden');
                        interestInput.classList.add('hidden');
                        document.getElementById('loanAnnualRate').value = loan.annualRate;
                    } else {
                        document.querySelector('input[name="loanInputMode"][value="interest"]').checked = true;
                        rateInput.classList.add('hidden');
                        interestInput.classList.remove('hidden');
                        document.getElementById('loanTotalInterest').value = loan.totalInterest;
                    }
                    
                    loanModal.classList.remove('hidden');
                });
            });
            
            document.querySelectorAll('.delete-loan-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const platformId = parseInt(e.currentTarget.dataset.platformId);
                    const loanId = parseInt(e.currentTarget.dataset.loanId);
                    platforms = platforms.map(platform => {
                        if (platform.id === platformId) {
                            return {
                                ...platform,
                                loans: platform.loans.filter(loan => loan.id !== loanId)
                            };
                        }
                        return platform;
                    });
                    renderPlatforms();
                    updateSummary();
                    updateMonthlySummary();
                    showSaveNotification();
                });
            });
        }

        function generateScheduleFromTotalInterest(totalAmount, totalInterest, totalMonths, repaidMonths, gracePeriod = 0) {
            if (totalAmount <= 0 || totalMonths <= 0) return [];
            
            const graceMonths = Math.min(gracePeriod, totalMonths);
            const normalMonths = Math.max(0, totalMonths - gracePeriod);
            
            let schedule = [];
            let remainingBalance = totalAmount;
            
            const graceInterest = totalInterest * (graceMonths / Math.max(1, totalMonths));
            const normalInterest = totalInterest - graceInterest;
            
            for (let month = 1; month <= totalMonths; month++) {
                if (month <= gracePeriod) {
                    const monthlyInterest = graceMonths > 0 ? graceInterest / graceMonths : 0;
                    schedule.push({
                        month: month,
                        principal: 0,
                        interest: monthlyInterest,
                        total: monthlyInterest,
                        balance: remainingBalance
                    });
                } else {
                    const monthlyPrincipal = normalMonths > 0 ? totalAmount / normalMonths : 0;
                    const monthlyInterest = normalMonths > 0 ? normalInterest / normalMonths : 0;
                    const endingBalance = Math.max(0, remainingBalance - monthlyPrincipal);
                    
                    schedule.push({
                        month: month,
                        principal: monthlyPrincipal,
                        interest: monthlyInterest,
                        total: monthlyPrincipal + monthlyInterest,
                        balance: endingBalance
                    });
                    remainingBalance = endingBalance;
                }
            }
            
            return schedule;
        }

        // Event Listeners
        addPlatformBtn.addEventListener('click', () => {
            editingPlatform = null;
            document.getElementById('platformModalTitle').textContent = '添加新平台';
            document.getElementById('platformName').value = '';
            document.getElementById('repaymentDay').value = '';
            platformModal.classList.remove('hidden');
        });

        addLoanBtn.addEventListener('click', () => {
            editingLoan = null;
            document.getElementById('loanModalTitle').textContent = '添加新借据';
            document.getElementById('loanPlatformId').value = '';
            document.getElementById('loanDescription').value = '';
            document.getElementById('loanTotalAmount').value = '';
            document.getElementById('loanTotalMonths').value = '';
            document.getElementById('loanRepaidMonths').value = '';
            document.getElementById('loanGracePeriod').value = '';
            document.getElementById('loanRepaymentType').value = 'equal_principal_interest';
            document.querySelector('input[name="loanInputMode"][value="rate"]').checked = true;
            rateInput.classList.remove('hidden');
            interestInput.classList.add('hidden');
            document.getElementById('loanAnnualRate').value = '';
            document.getElementById('loanTotalInterest').value = '';
            loanModal.classList.remove('hidden');
        });

        cancelPlatformBtn.addEventListener('click', () => {
            platformModal.classList.add('hidden');
        });

        cancelLoanBtn.addEventListener('click', () => {
            loanModal.classList.add('hidden');
        });

        loanInputModeRadios.forEach(radio => {
            radio.addEventListener('change', () => {
                if (radio.value === 'rate') {
                    rateInput.classList.remove('hidden');
                    interestInput.classList.add('hidden');
                } else {
                    rateInput.classList.add('hidden');
                    interestInput.classList.remove('hidden');
                }
            });
        });

        platformForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const platformData = {
                id: editingPlatform || Date.now(),
                name: document.getElementById('platformName').value,
                repaymentDay: parseInt(document.getElementById('repaymentDay').value)
            };
            
            if (editingPlatform) {
                platforms = platforms.map(p => p.id === editingPlatform ? platformData : p);
            } else {
                platformData.loans = [];
                platforms.push(platformData);
            }
            
            platformModal.classList.add('hidden');
            renderPlatforms();
            updateSummary();
            updateMonthlySummary();
            updatePlatformSelect();
            showSaveNotification();
        });

        loanForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const loanData = {
                id: editingLoan ? editingLoan.loanId : Date.now(),
                description: document.getElementById('loanDescription').value,
                totalAmount: parseFloat(document.getElementById('loanTotalAmount').value),
                totalMonths: parseInt(document.getElementById('loanTotalMonths').value),
                repaidMonths: parseInt(document.getElementById('loanRepaidMonths').value) || 0,
                repaymentType: document.getElementById('loanRepaymentType').value,
                inputMode: document.querySelector('input[name="loanInputMode"]:checked').value,
                gracePeriod: parseInt(document.getElementById('loanGracePeriod').value) || 0
            };
            
            if (loanData.inputMode === 'rate') {
                loanData.annualRate = parseFloat(document.getElementById('loanAnnualRate').value);
            } else {
                loanData.totalInterest = parseFloat(document.getElementById('loanTotalInterest').value);
            }
            
            const platformId = parseInt(document.getElementById('loanPlatformId').value);
            
            if (editingLoan) {
                platforms = platforms.map(platform => {
                    if (platform.id === platformId) {
                        return {
                            ...platform,
                            loans: platform.loans.map(loan => loan.id === editingLoan.loanId ? loanData : loan)
                        };
                    }
                    return platform;
                });
            } else {
                platforms = platforms.map(platform => {
                    if (platform.id === platformId) {
                        return {
                            ...platform,
                            loans: [...platform.loans, loanData]
                        };
                    }
                    return platform;
                });
            }
            
            loanModal.classList.add('hidden');
            renderPlatforms();
            updateSummary();
            updateMonthlySummary();
            showSaveNotification();
        });

        // Initialize
        updatePlatformSelect();
        updateSummary();
        updateMonthlySummary();
    </script>
</body>
</html>
